name: 네이버 검색 순위 체크 (복재성)

on:
  schedule:
    - cron: '0 * * * *'   # 매시간 정각 실행 (UTC 기준)
  workflow_dispatch:       # 수동 실행 허용

permissions:
  contents: write

jobs:
  check-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 네이버 순위 체크 실행
        env:
          # GitHub 저장소 Settings → Secrets and variables → Actions 에서 등록
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}    # 발신 Gmail 주소
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }} # Gmail 앱 비밀번호
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
        run: python naver_ranking_checker.py

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "변경 사항 없음 (결과 동일)"
          else
            TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: 복재성 네이버 순위 체크 - ${TIMESTAMP}"
            git push origin HEAD
          fi
